apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmer
  namespace: swarmer
  labels:
    app: swarmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarmer
  # Only one replica safe with SQLite — no concurrent writers
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: swarmer
    spec:
      serviceAccountName: swarmer
      securityContext:
        # FS_GROUP_VALUE is replaced by the deploy Makefile target:
        #   OpenShift:           fsGroup: 1001
        #   generic K8s / kind:  this line is deleted, leaving an empty securityContext: {}
        fsGroup: FS_GROUP_VALUE

      containers:
        - name: swarmer
          # SWARMER_IMAGE is replaced by the deploy Makefile target
          image: SWARMER_IMAGE
          # IMAGE_PULL_POLICY_VALUE: IfNotPresent (kind/generic K8s) or Always (OpenShift)
          imagePullPolicy: IMAGE_PULL_POLICY_VALUE
          ports:
            - containerPort: 8080
              name: http

          env:
            - name: K8S_IN_CLUSTER
              value: "true"
            - name: DATABASE_URL
              value: sqlite+aiosqlite:////data/swarmer.db
            - name: SWARMER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: swarmer-secret
                  key: SWARMER_SECRET_KEY
            - name: K8S_API_URL
              value: "https://kubernetes.default.svc"
            - name: OPENSHIFT_OAUTH_URL
              value: "OPENSHIFT_OAUTH_URL_VALUE"
            - name: REDIRECT_BASE_URL
              value: "REDIRECT_BASE_URL_VALUE"
            - name: DEFAULT_AGENT_TOOL
              value: "DEFAULT_AGENT_TOOL_VALUE"
            - name: AGENT_IMAGE_OPENCODE
              value: "AGENT_IMAGE_OPENCODE_VALUE"
            - name: MAX_CONCURRENT_AGENTS
              value: "MAX_CONCURRENT_AGENTS_VALUE"
            - name: OPENSHELL_GATEWAY_URL
              value: "OPENSHELL_GATEWAY_URL_VALUE"
            - name: OPENSHELL_TLS_CA
              value: "/auth/openshell/ca.crt"
            - name: OPENSHELL_TLS_CERT
              value: "/auth/openshell/tls.crt"
            - name: OPENSHELL_TLS_KEY
              value: "/auth/openshell/tls.key"
            # Model preset mappings (ACM-37232) — edit these values directly (no code
            # change or image rebuild needed) when Vertex AI / Google ship new model
            # versions. Falls back to the swarmer/config.py Settings defaults if this
            # whole block is removed.
            - name: CLAUDE_PRESET_PLAN_MODEL
              value: "google-vertex-anthropic/claude-opus-4-6@default"
            - name: CLAUDE_PRESET_BUILD_MODEL
              value: "google-vertex-anthropic/claude-sonnet-5@default"
            - name: CLAUDE_PRESET_SMALL_MODEL
              value: "google-vertex-anthropic/claude-haiku-4-5@20251001"
            - name: GEMINI_PRESET_PLAN_MODEL
              value: "google/gemini-3.1-pro-preview"
            - name: GEMINI_PRESET_BUILD_MODEL
              value: "google/gemini-3.5-flash"
            - name: GEMINI_PRESET_SMALL_MODEL
              value: "google/gemini-3.1-flash-lite"
            - name: OPENCODE_EXPERIMENTAL_PLAN_MODE
              value: "true"

          volumeMounts:
            - name: swarmer-data
              mountPath: /data
            - name: openshell-tls
              mountPath: /auth/openshell
              readOnly: true

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: swarmer-data
          persistentVolumeClaim:
            claimName: swarmer-data
        - name: openshell-tls
          secret:
            secretName: openshell-tls
