apiVersion: v1
kind: ConfigMap
metadata:
  name: swarmer-model-presets
  namespace: swarmer
  labels:
    app: swarmer
data:
  # Claude/Gemini/OpenAI preset -> model-ID mappings (ACM-37232). Edit these values
  # directly and re-apply this file, then restart the swarmer deployment
  # (kubectl rollout restart deployment/swarmer -n swarmer) to pick up new
  # Vertex AI / Google model versions — no code change or image rebuild
  # needed. Falls back to the swarmer/config.py Settings defaults (which
  # match the values below) if this ConfigMap is removed.
  CLAUDE_PRESET_PLAN_MODEL: "google-vertex/claude-opus-4-6@default"
  CLAUDE_PRESET_BUILD_MODEL: "google-vertex/claude-sonnet-5@default"
  CLAUDE_PRESET_SMALL_MODEL: "google-vertex/claude-haiku-4-5@20251001"
  GEMINI_PRESET_PLAN_MODEL: "google/gemini-4-argon"
  GEMINI_PRESET_BUILD_MODEL: "google/gemini-3.8-flash"
  GEMINI_PRESET_SMALL_MODEL: "google/gemini-3.5-flash-lite"
  OPENAI_PRESET_PLAN_MODEL: "openai/gpt-6.1-sol"
  OPENAI_PRESET_BUILD_MODEL: "openai/gpt-6-luna"
  OPENAI_PRESET_SMALL_MODEL: "openai/gpt-6-luna"
  # EnMaaS preset role models — zero-cost GLM-5.3. The gateway URL is
  # workspace configuration entered by a manager in Settings > Tokens.
  ENMAAS_PRESET_PLAN_MODEL: "enmaas/rits/zai-org/glm-5-3"
  ENMAAS_PRESET_BUILD_MODEL: "enmaas/rits/zai-org/glm-5-3"
  ENMAAS_PRESET_SMALL_MODEL: "enmaas/rits/zai-org/glm-5-3"
  OPENCODE_EXPERIMENTAL_PLAN_MODE: "true"
