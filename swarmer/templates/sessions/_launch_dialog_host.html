<div id="launch-dialog-backdrop" class="pf-v6-c-backdrop" hidden aria-hidden="true"
     style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.65); overflow-y:auto; box-sizing:border-box; padding:var(--pf-t--global--spacer--lg); flex-direction:column; align-items:center;">
  <div id="launch-dialog" class="pf-v6-c-modal-box pf-m-lg" role="dialog"
       aria-modal="true" aria-labelledby="launch-dialog-title" tabindex="-1"
       style="margin-block:auto; min-height:0; max-height:none; overflow:visible; flex-shrink:0;">
    <div id="launch-dialog-content" aria-live="polite"></div>
  </div>
</div>
<script>
  (function() {
    const backdrop = document.getElementById('launch-dialog-backdrop');
    const dialog = document.getElementById('launch-dialog');
    const content = document.getElementById('launch-dialog-content');
    let opener = null;
    function closeDialog() {
      if (backdrop.hidden) return;
      backdrop.hidden = true;
      backdrop.setAttribute('aria-hidden', 'true');
      backdrop.style.display = 'none';
      content.replaceChildren();
      if (opener && opener.isConnected) opener.focus();
      else document.querySelector('[data-launch-dialog-url]')?.focus();
      opener = null;
    }
    document.addEventListener('click', async function(event) {
      const launchButton = event.target.closest('[data-launch-dialog-url]');
      if (launchButton) {
        event.preventDefault();
        opener = launchButton;
        try {
          const response = await fetch(launchButton.dataset.launchDialogUrl, {
            headers: {'HX-Request': 'true'}
          });
          if (!response.ok) throw new Error('Could not load launch settings.');
          content.innerHTML = await response.text();
          backdrop.hidden = false;
          backdrop.setAttribute('aria-hidden', 'false');
          backdrop.style.display = 'flex';
          const promptSelect = content.querySelector('#launch-prompt-id');
          const updatePreview = function() {
            const selected = promptSelect.options[promptSelect.selectedIndex];
            const text = selected ? selected.dataset.content || '' : '';
            const preview = content.querySelector('#launch-prompt-preview-content');
            const empty = content.querySelector('#launch-no-prompt');
            preview.textContent = text;
            preview.hidden = !text;
            empty.hidden = Boolean(text);
          };
          promptSelect.addEventListener('change', updatePreview);
          updatePreview();
          const initial = content.querySelector('[autofocus]') || dialog;
          initial.focus();
        } catch (error) {
          if (opener && opener.isConnected) opener.focus();
          opener = null;
          window.alert(error.message || 'Could not load launch settings.');
        }
        return;
      }
      if (event.target.closest('[data-launch-dialog-close]')) closeDialog();
      if (event.target.id === 'clear-launch-instructions') {
        const instructions = content.querySelector('#launch-instruction-prompt');
        if (instructions) {
          instructions.value = '';
          event.target.disabled = true;
          instructions.focus();
        }
      }
      if (backdrop.contains(event.target) && !dialog.contains(event.target)) closeDialog();
    });
    document.addEventListener('submit', function(event) {
      if (event.target.id !== 'launch-confirm-form') return;
      const mode = event.target.querySelector('#launch-mode').value;
      sessionStorage.setItem('switchToTab', mode === 'tui' ? 'terminal' : 'output');
    });
    document.addEventListener('keydown', function(event) {
      if (backdrop.hidden) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        closeDialog();
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = Array.from(dialog.querySelectorAll(
        'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
      )).filter(element => element.offsetParent !== null);
      if (!focusable.length) {
        event.preventDefault();
        dialog.focus();
        return;
      }
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (!focusable.includes(document.activeElement)) {
        event.preventDefault(); first.focus();
      } else if (event.shiftKey && document.activeElement === first) {
        event.preventDefault(); last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault(); first.focus();
      }
    });
    document.addEventListener('input', function(event) {
      if (event.target.id !== 'launch-instruction-prompt') return;
      const clear = content.querySelector('#clear-launch-instructions');
      if (clear) clear.disabled = !event.target.value;
    });
  })();
</script>
