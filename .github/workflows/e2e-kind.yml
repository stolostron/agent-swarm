name: KinD E2E

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable published Swarmer image reference to test
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  kind-lifecycle:
    name: E2E test
    runs-on: ubuntu-latest
    env:
      CONTAINER_CMD: docker
      KIND_CLUSTER: swarmer
      NAMESPACE: swarmer

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install KinD
        run: |
          curl -fsSLo kind-linux-amd64 https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          curl -fsSLo kind.sha256sum https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64.sha256sum
          sha256sum --check kind.sha256sum
          chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind
          kind version

      - name: Set up Swarmer secret
        run: make setup-secret

      - name: Install MCP server
        run: python3 -m pip install --quiet -e mcp-server

      - name: Run KinD deployment lifecycle e2e
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          args=()
          if [[ -n "$IMAGE_REF" ]]; then
            args+=(--image-ref "$IMAGE_REF")
          fi
          python3 scripts/e2e_kind_deploy.py \
            --cluster-name "$KIND_CLUSTER" \
            --namespace "$NAMESPACE" \
            "${args[@]}"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by='.lastTimestamp' || true
          kubectl logs -n swarmer deployment/swarmer --tail=200 || true
          kubectl logs -n openshell deployment/openshell --tail=200 || true
