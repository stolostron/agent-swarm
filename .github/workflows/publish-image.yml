name: Publish image

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish squash-merged images to Quay
    runs-on: ubuntu-latest
    concurrency:
      group: swarmer-image-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    env:
      CONTAINER_CMD: docker
    steps:
      - name: Check out main with full history for catch-up and metadata commits
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Podman if needed
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Install KinD
        run: |
          curl -fsSLo kind-linux-amd64 https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          curl -fsSLo kind.sha256sum https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64.sha256sum
          sha256sum --check kind.sha256sum
          chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind
          kind version

      - name: Prepare KinD E2E dependencies
        run: |
          make setup-secret
          python3 -m pip install --quiet -e mcp-server

      - name: Publish all unprocessed squash merges
        env:
          GH_TOKEN: ${{ github.token }}
          QUAY_REPOSITORY_PATH: ${{ vars.QUAY_REPOSITORY_PATH }}
          QUAY_ROBOT_USERNAME: ${{ vars.QUAY_ROBOT_USERNAME }}
          QUAY_PUSH_TOKEN: ${{ secrets.QUAY_PUSH_TOKEN }}
        run: python3 scripts/publish_image.py
