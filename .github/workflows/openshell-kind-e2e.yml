name: OpenShell Swarmer on Kind

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/openshell-kind-e2e.yml"
      - ".env.example"
      - "Containerfile"
      - "Makefile"
      - "k8s/openshell/**"
      - "requirements.txt"
      - "scripts/openshell_deploy.py"
      - "swarmer/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openshell-kind:
    name: Deploy Swarmer as an OpenShell sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTAINER_CMD: docker
      KIND_CLUSTER: swarmer
      NAMESPACE: swarmer
      KIND_EXPERIMENTAL_PROVIDER: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install KinD
        run: |
          curl -fsSLo kind-linux-amd64 https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          curl -fsSLo kind.sha256sum https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64.sha256sum
          sha256sum --check kind.sha256sum
          chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind
          kind version

      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio respx

      - name: Run unit, API, policy, and MCP tests
        run: make test

      - name: Generate local Swarmer key
        run: make setup-secret

      - name: Deploy the Kind/OpenShell stack and Swarmer sandbox
        run: make kind-openshell-deploy

      - name: Collect non-secret diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by='.lastTimestamp' || true

      - name: Delete the workflow-owned Kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true
