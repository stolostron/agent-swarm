name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # pytest, pytest-asyncio, and httpx are used by the test suite but not
      # declared in requirements.txt (which lists production deps only).
      - run: pip install pytest pytest-asyncio httpx

      - run: make test
